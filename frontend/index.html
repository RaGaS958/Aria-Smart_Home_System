<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#060a12" />
    <meta name="description" content="ARIA — Advanced Responsive Intelligence Assistant. Your intelligent 3D home companion." />
    <title>ARIA — Home Intelligence</title>

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Critical CSS — prevents FOUC */
      html, body, #root {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        overflow: hidden;
        background: #060a12;
      }
      /* Scrollbar */
      ::-webkit-scrollbar { width: 3px; height: 3px; }
      ::-webkit-scrollbar-thumb { background: rgba(99,195,255,0.25); border-radius: 2px; }
      ::-webkit-scrollbar-track { background: transparent; }
      /* Selection */
      ::selection { background: rgba(0,255,170,0.2); color: #00ffaa; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
