[pytest]
# ── Test discovery ────────────────────────────────────────────────────────────
testpaths        = tests
python_files     = test_*.py
python_classes   = Test*
python_functions = test_*

# ── Asyncio ───────────────────────────────────────────────────────────────────
asyncio_mode = auto

# ── Output ───────────────────────────────────────────────────────────────────
addopts =
    -v
    --tb=short
    --strict-markers
    --no-header
    -p no:warnings
    --color=yes
    --durations=10

# ── Custom markers ────────────────────────────────────────────────────────────
markers =
    integration: marks tests that call real external APIs (deselect with -m "not integration")
    slow: marks tests that take > 2 s

# ── Logging ──────────────────────────────────────────────────────────────────
log_cli            = false
log_cli_level      = INFO
log_cli_format     = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
